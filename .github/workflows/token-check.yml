name: Token check
on:
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: See if VERCEL_TOKEN is set
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          if [ -n "$VERCEL_TOKEN" ]; then
            echo "VERCEL_TOKEN=set length=${#VERCEL_TOKEN}"
          else
            echo "VERCEL_TOKEN=missing"
          fi

